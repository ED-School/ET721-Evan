<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Item</title>
    <link rel="stylesheet" href="{{url_for('static', filename='style.css')}}">
</head>
<body>
    <main class="page-shell">
        <h1 class="title">Evan Dong</h1>
        <h2>Create Item</h2>
        <form id="itemForm">
            <div class="formsession">
                <label>Name:
                    <input type="text" id="name" required>
                </label>
            </div>
            <div class="formsession">
                <label>Price:
                    <input type="text" id="price" required>
                </label>
            </div>
            <div class="formsession">
                <button type="submit">SUBMIT</button>
            </div>
            <p id="response"></p>
        </form>

        <section class="loaditems">
            <h2>ALL ITEMS</h2>
            <button onclick="loaditems()">LOAD ITEMS</button>
            <ul class="itemslist"></ul>
        </section>

        <section id="updatedsection">
            <h3>Update Item</h3>
            <input type="hidden" id="updateID">
            <label>Name:
                <input type="text" id="updateName">
            </label>
            <label>Price:
                <input type="text" id="updatePrice">
            </label>
            <button onclick="updateItems()">SAVE ITEM</button>
        </section>
    </main>

    <script src="{{url_for('static', filename = 'app_script.js')}}"></script>
</body>
</html>
