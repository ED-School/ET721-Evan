<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Employee Form</title>
    <link rel = "stylesheet" href = "{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1 class="title">Evan Dong</h1>
    <main class="container">
        <h2 style="text-align: center;">Add Employee</h2>
        <form method="POST">
            <div>
                <label for="employeename">Name:</label>
                <input type="text" name="name" id="employeename" required>
            </div>
            <div>
                <label for="employeeid">ID:</label>
                <input type="number" name="id" id="employeeid" required>
            </div>
            <div>
                <label for="employeesalary">Salary:</label>
                <input type="number" name="salary" id="employeesalary" required>
            </div>
            <div>
                <button type="submit" name="action" value="submit">SUBMIT</button>
            </div>
            <div>
                <button type="submit" name="action" value="increasesalary">Increase Salary</button>
            </div>
        </form>
        <div class="dbmsg">
            <p>{{ msg|safe }}</p>
        </div>
    </main>
    <footer class="footer">
        Mini Form App @ October 2026 by Evan Dong
    </footer>
</body>
</html>
