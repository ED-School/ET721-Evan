<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device=width, initial-scale=1.0">
    <title>Lab 10: intro to Flask</title>
    <link rel="stylesheet" href="{{url_for("static", filename="style.css")}}">
</head>
<body>
    <h1>Welcome to Flask!</h1>
    <h2>Evan Dong</h2>
    <h3>My list</h3>
    <ul>
        {% for eachfruit in listfruits %}
            <li>{{eachfruit}}</li>
        {% endfor %}
    </ul>

    {% if "kiwis" in listfruits %}
        <p>Great! we have kiwis for today</p>
    {% else %}
        <p>Kiwis are not in the list</p>
    {% endif %}
</body>
</html>
